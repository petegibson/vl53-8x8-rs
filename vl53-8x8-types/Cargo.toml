[package]
name = "vl53-8x8-types"
version = "0.1.1"
edition = "2021"
rust-version = "1.81"
license = "BSD-3-Clause"
description = "Shared types for the STMicroelectronics VL53L5CX and VL53L8CX 8x8 multizone Time-of-Flight sensor drivers (vl53-8x8, vl53l8cx-uld)."
documentation = "https://docs.rs/vl53-8x8-types"
repository = "https://github.com/petegibson/vl53-8x8-rs"
readme = "README.md"
keywords = ["vl53l5cx", "vl53l8cx", "tof", "embedded-hal", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]

[package.metadata.docs.rs]
features = ["xtalk", "motion", "thresholds"]

[dependencies]
# Only for the `OutputPin` bound of `MaybeOutputPin`; no code of embedded-hal is run.
embedded-hal = "1.0.0"

[features]
# Plugin features. This crate has no code of its own behind them; they only
# gate the types and constants that belong to the corresponding ULD plugin.
xtalk = []
motion = []
thresholds = []
