[workspace]
members = [
    "vl53-8x8-types",
    "vl53l8cx-uld-sys",
    "vl53l5cx-uld-sys",
    "vl53l8cx-uld",
    "vl53l5cx-uld",
    "vl53-8x8",
    "differential-tests",
]
# Board demo crates: standalone roots with their own target/HAL/linker
# config, not published.
exclude = [
    "examples/nucleo-f401re-uld",
    "examples/nucleo-f401re-embassy",
    "examples/nucleo-f401re-rtic",
    "examples/evo-f412re-embassy",
    "examples/evo-f412re-uld",
    "examples/rpi-zero-2w",
]
resolver = "2"
