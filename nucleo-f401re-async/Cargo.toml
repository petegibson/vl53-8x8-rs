[package]
name = "nucleo-f401re-async"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
embassy-executor = { version = "0.9", default-features = false, features = ["executor-thread", "arch-cortex-m"] }
embassy-stm32 = { version = "0.2", features = ["stm32f401re", "time-driver-any", "memory-x"] }
embassy-time = "0.4"
embedded-hal = "1.0"
vl53l8cx-async = { path = "../vl53l8cx-async" }

[dev-dependencies]
embedded-test = { version = "0.7", features = ["defmt", "embassy"] }

[[test]]
name = "sensor_async"
path = "tests/sensor_async.rs"
harness = false

[profile.release]
debug = 2
lto = true
opt-level = "s"
