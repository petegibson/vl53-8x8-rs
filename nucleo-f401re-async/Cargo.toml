[package]
name = "nucleo-f401re-async"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.9.0", default-features = false, features = ["executor-thread", "arch-cortex-m", "defmt"] }
embassy-stm32 = { version = "0.5", features = ["stm32f401re", "time-driver-any", "memory-x", "defmt"] }
embassy-time = "0.5.0"
embedded-hal = "1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
vl53l8cx-async = { path = "../vl53l8cx-async", features = ["defmt"] }

[dev-dependencies]
embedded-test = { version = "0.7", features = ["defmt", "embassy"] }

[[test]]
name = "sensor_async"
path = "tests/sensor_async.rs"
harness = false

[profile.release]
debug = 2
lto = true
opt-level = "s"
