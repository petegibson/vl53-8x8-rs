[package]
name = "nucleo-f401re"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
stm32f4xx-hal = { version = "0.22", features = ["stm32f401"] }
embedded-hal = "1.0"
vl53l8cx-uld = { path = "../vl53l8cx-uld" }
embedded-hal-bus = { version = "0.2", optional = true }
panic-probe = { version = "0.3", features = ["print-defmt"], optional = true }

[dev-dependencies]
embedded-test = { version = "0.7", features = ["defmt"] }

[features]
default = ["dep:panic-probe"]
defmt = ["vl53l8cx-uld/defmt"]
defmt-bus-trace = ["defmt"]
spi-bus = ["dep:embedded-hal-bus", "dep:panic-probe"]
xtalk = ["vl53l8cx-uld/xtalk"]
motion = ["vl53l8cx-uld/motion"]
thresholds = ["vl53l8cx-uld/thresholds"]

[lib]
test = false

[[bin]]
name = "basic_ranging"
path = "src/bin/basic_ranging.rs"
test = false

[[test]]
name = "sensor"
path = "tests/sensor.rs"
harness = false


[profile.release]
debug = 2
lto = true
opt-level = "s"

# Standalone root: this demo is excluded from the parent workspace.
[workspace]
