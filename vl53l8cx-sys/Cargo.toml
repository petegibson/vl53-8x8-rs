[package]
name = "vl53l8cx-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Low-level FFI bindings for the STMicroelectronics VL53L8CX Ultra Lite Driver (ULD)."
license = "BSD-3-Clause"
links = "vl53l8cx_uld"

[dependencies]
cty = "0.2"
vl53-8x8-types = { path = "../vl53-8x8-types", version = "0.1.0" }

[build-dependencies]
bindgen = "0.69"
cc = "1.2"

[features]
# Standard Plugin Features (Opt-in to include)
xtalk = ["vl53-8x8-types/xtalk"]
motion = ["vl53-8x8-types/motion"]
thresholds = ["vl53-8x8-types/thresholds"]

# --- New Feature: Raw Firmware Format ---
raw-format = []

# --- Output Disablement Features for Size Optimization (Opt-in to DISABLE/remove) ---
disable-ambient = []
disable-spads = []
disable-nb-targets = []
disable-signal = []
disable-range-sigma = []
disable-distance = []
disable-target-status = []
disable-reflectance = []
disable-motion-indicator-output = []
