[package]
name = "rpi-zero-2w"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Raspberry Pi Zero 2W VL53L8CX example driving a Pololu breakout via SPI0."
publish = false

[dependencies]
vl53l8cx-uld = { path = "../../vl53l8cx-uld" }
vl53-8x8 = { path = "../../vl53-8x8" }
linux-embedded-hal = "0.4"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
tokio = { version = "1", features = ["rt", "macros", "time"] }
anyhow = "1"
env_logger = "0.11"
log = "0.4"

# Standalone root: this demo is excluded from the parent workspace.
[workspace]
