[package]
name = "nucleo-f401re-embassy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.10.0", default-features = false, features = ["executor-thread", "platform-cortex-m", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f401re", "time-driver-any", "memory-x", "defmt"] }
embassy-time = "0.5.1"
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"], optional = true }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
vl53-8x8 = { path = "../../vl53-8x8" }

[features]
default = []
blocking-i2c = []
spi-bus = ["dep:embedded-hal-bus"]
defmt-bus-trace = ["vl53-8x8/defmt"]
xtalk = ["vl53-8x8/xtalk"]
motion = ["vl53-8x8/motion"]
thresholds = ["vl53-8x8/thresholds"]
# Targets per zone (default 1); mutually exclusive, forwarded to the driver.
targets-2 = ["vl53-8x8/targets-2"]
targets-3 = ["vl53-8x8/targets-3"]
targets-4 = ["vl53-8x8/targets-4"]

[[bin]]
name = "nucleo-f401re-embassy"
test = false

[dev-dependencies]
embedded-test = { version = "0.7.2", features = ["defmt", "embassy-010"] }
static_cell = "2.1"

[[test]]
name = "sensor_async"
path = "tests/sensor_async.rs"
harness = false

[[test]]
name = "sensor_async_extra"
path = "tests/sensor_async_extra.rs"
harness = false

[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
lto = true
opt-level = "s"

# Standalone root: this demo is excluded from the parent workspace.
[workspace]
