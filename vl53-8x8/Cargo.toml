[package]
name = "vl53-8x8"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "BSD-3-Clause"
description = "Pure-Rust async embedded-hal driver for the STMicroelectronics VL53L5CX and VL53L8CX 8x8 multizone Time-of-Flight sensors (variant autodetect, no C toolchain)."
documentation = "https://docs.rs/vl53-8x8"
repository = "https://github.com/petegibson/vl53-8x8-rs"
readme = "README.md"
keywords = ["vl53l5cx", "vl53l8cx", "tof", "embedded-hal", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]

[package.metadata.docs.rs]
features = ["xtalk", "motion", "thresholds"]

[dependencies]
vl53-8x8-types = { path = "../vl53-8x8-types", version = "0.1.0" }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
defmt = { version = "1", optional = true }

[dev-dependencies]
# Oracle for the tests only: the C ULD as compiled by bindgen/cc. Never linked
# into the driver, so downstream builds need no libclang. Built with its default
# features; layout tests therefore run only under this crate's default features.
vl53l8cx-uld-sys = { path = "../vl53l8cx-uld-sys", version = "0.1.0" }
# VL53L5CX oracle: ST's L5 ULD, compiled the same way. Path-only dev-dependency
# (Cargo strips path-only dev-dependencies from the published manifest). Lets
# the tests check the L5 firmware/config patches against ST's real L5 arrays.
vl53l5cx-uld-sys = { path = "../vl53l5cx-uld-sys" }

[features]
default = []
# ULD plugins. Gate the plugin APIs here and the matching types in vl53-8x8-types.
xtalk = ["vl53-8x8-types/xtalk"]
motion = ["vl53-8x8-types/motion"]
thresholds = ["vl53-8x8-types/thresholds"]
# Return results in the sensor's raw fixed-point units instead of converting
# to mm / kcps / percent (ULD `VL53L8CX_USE_RAW_FORMAT`).
raw-format = []

# Targets per zone (ULD `VL53L8CX_NB_TARGET_PER_ZONE`); default is 1.
targets-1 = []
targets-2 = []
targets-3 = []
targets-4 = []

# Drop individual result outputs to shrink frames and `ResultsData`
# (ULD `VL53L8CX_DISABLE_*`). See `results.rs` for the exact mapping.
disable-ambient = []
disable-spads = []
disable-nb-targets = []
disable-signal = []
disable-range-sigma = []
disable-distance = []
disable-target-status = []
disable-reflectance = []
disable-motion-indicator-output = []
