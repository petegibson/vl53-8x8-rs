[package]
name = "evo-f412re-async"
version = "0.1.0"
edition = "2021"
publish = false
description = "Async VL53L5CX/VL53L8CX demo for a custom STM32F412RE board (autodetect + patched firmware)."

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0"
defmt-rtt = "1.1"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1"
embassy-stm32 = { version = "0.6.0", features = ["stm32f412re", "time-driver-tim2", "memory-x", "exti", "defmt"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "tick-hz-32_768"] }
embedded-hal = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
vl53-8x8 = { path = "../vl53-8x8" }

[features]
default = []
# Forward driver I2C trace logging.
defmt-bus-trace = ["vl53-8x8/defmt"]
xtalk = ["vl53-8x8/xtalk"]
motion = ["vl53-8x8/motion"]
thresholds = ["vl53-8x8/thresholds"]
# Targets per zone (default 1); mutually exclusive, forwarded to the driver.
targets-2 = ["vl53-8x8/targets-2"]
targets-3 = ["vl53-8x8/targets-3"]
targets-4 = ["vl53-8x8/targets-4"]

[[bin]]
name = "evo-f412re-async"
test = false

[dev-dependencies]
embedded-test = { version = "0.7.2", features = ["defmt", "embassy-010"] }

[[test]]
name = "sensor_async"
path = "tests/sensor_async.rs"
harness = false

[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
lto = true
opt-level = "s"

# Standalone root: this demo is excluded from the parent workspace.
[workspace]
