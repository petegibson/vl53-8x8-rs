[package]
name = "vl53l5cx-uld-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "BSD-3-Clause"
description = "Raw FFI bindings (bindgen + cc) to the STMicroelectronics VL53L5CX Ultra Lite Driver (ULD) C sources."
documentation = "https://docs.rs/vl53l5cx-uld-sys"
repository = "https://github.com/petegibson/vl53-8x8-rs"
readme = "README.md"
keywords = ["vl53l5cx", "tof", "embedded-hal", "no-std", "uld"]
categories = ["embedded", "no-std", "hardware-support"]
links = "vl53l5cx_uld"

[package.metadata.docs.rs]
features = ["xtalk", "motion", "thresholds"]

[dependencies]
cty = "0.2"
vl53-8x8-types = { path = "../vl53-8x8-types", version = "0.1.0" }

[build-dependencies]
bindgen = "0.69"
cc = "1.2"

[features]
# Standard Plugin Features (Opt-in to include)
xtalk = ["vl53-8x8-types/xtalk"]
motion = ["vl53-8x8-types/motion"]
thresholds = ["vl53-8x8-types/thresholds"]

# --- Raw Firmware Format ---
raw-format = []

# --- Targets per zone ---
# Select `VL53L5CX_NB_TARGET_PER_ZONE` for the C build and the bindgen pass.
# The default (no feature, or `targets-1`) is one target per zone. Enabling
# more than one `targets-N` feature is a build error (`build.rs` panics):
# the macro can only take a single value, and cargo unions features across
# the dependency graph, so a silent "highest wins" rule would let one crate
# change the `VL53L5CX_ResultsData` layout another crate was written for.
# Per-target result arrays (`distance_mm`, `target_status`, ...) then hold
# `64 * N` entries indexed `zone * N + target`.
targets-1 = []
targets-2 = []
targets-3 = []
targets-4 = []

# --- Output Disablement Features for Size Optimization (Opt-in to DISABLE/remove) ---
disable-ambient = []
disable-spads = []
disable-nb-targets = []
disable-signal = []
disable-range-sigma = []
disable-distance = []
disable-target-status = []
disable-reflectance = []
disable-motion-indicator-output = []
